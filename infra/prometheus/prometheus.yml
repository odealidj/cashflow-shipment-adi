global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'gateway-go'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['gateway-go:8080', 'host.docker.internal:8080']
        labels:
          service: 'api-gateway'

  - job_name: 'core-go'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['core-go:8081', 'host.docker.internal:8081']
        labels:
          service: 'core-backend'
