basePath: /api/v1
definitions:
  domain.ActivityPreset:
    properties:
      category:
        description: '''ACT_INFO'' or ''ACT_EXPLAIN'''
        type: string
      created_at:
        type: string
      deleted_at:
        type: string
      description:
        type: string
      id:
        type: integer
      is_active:
        type: boolean
      name:
        type: string
      updated_at:
        type: string
    type: object
  domain.CashflowEntry:
    properties:
      act_explaination:
        type: string
      act_information:
        type: string
      created_at:
        type: string
      created_by:
        type: string
      date_of_entry:
        type: string
      debit:
        type: number
      due_date:
        type: string
      entry_type:
        $ref: '#/definitions/domain.EntryType'
      grand_cost:
        type: number
      grand_selling:
        type: number
      id:
        type: integer
      invoice_id:
        type: integer
      kredit:
        type: number
      margin_pct:
        type: number
      profit:
        type: number
      remarks:
        $ref: '#/definitions/domain.PaymentStatus'
      saldo:
        type: number
      sequence_no:
        type: integer
      top_days:
        type: integer
      updated_at:
        type: string
      updated_by:
        type: string
      vendor_id:
        type: integer
      vendor_name_raw:
        type: string
    type: object
  domain.Customer:
    properties:
      address:
        type: string
      created_at:
        type: string
      deleted_at:
        type: string
      email:
        type: string
      id:
        type: integer
      name:
        type: string
      notes:
        type: string
      phone:
        type: string
      pic_name:
        type: string
      updated_at:
        type: string
    type: object
  domain.EntryType:
    enum:
    - SHIPMENT
    - TOP_UP
    - INVOICE_PAYMENT
    type: string
    x-enum-varnames:
    - EntryShipment
    - EntryTopUp
    - EntryInvoicePayment
  domain.PaymentStatus:
    enum:
    - PAID
    - UNPAID
    - PENDING
    type: string
    x-enum-varnames:
    - PaymentPaid
    - PaymentUnpaid
    - PaymentPending
  domain.UserRole:
    enum:
    - super_admin
    - admin
    - finance
    - direktur
    - owner
    - operator
    - viewer
    type: string
    x-enum-comments:
      RoleAdmin: Administrator Bisnis / Head of Operations
      RoleDirektur: Direktur / Manajemen (Monitoring & Review)
      RoleFinance: Staf Keuangan & Akuntansi (Input Transaksi & Invoice)
      RoleOwner: Pemilik Modal / Investor (Executive Dashboard)
      RoleSuperAdmin: IT Master / Developer (Tersembunyi, Fail-safe All Access)
    x-enum-descriptions:
    - IT Master / Developer (Tersembunyi, Fail-safe All Access)
    - Administrator Bisnis / Head of Operations
    - Staf Keuangan & Akuntansi (Input Transaksi & Invoice)
    - Direktur / Manajemen (Monitoring & Review)
    - Pemilik Modal / Investor (Executive Dashboard)
    - ""
    - ""
    x-enum-varnames:
    - RoleSuperAdmin
    - RoleAdmin
    - RoleFinance
    - RoleDirektur
    - RoleOwner
    - RoleOperator
    - RoleViewer
  domain.UserStatus:
    enum:
    - ACTIVE
    - INACTIVE
    - SUSPENDED
    type: string
    x-enum-varnames:
    - StatusActive
    - StatusInactive
    - StatusSuspended
  domain.Vendor:
    properties:
      created_at:
        type: string
      deleted_at:
        type: string
      email:
        type: string
      id:
        type: integer
      name:
        type: string
      notes:
        type: string
      phone:
        type: string
      updated_at:
        type: string
    type: object
  handler.BenchmarkCheck:
    properties:
      fails:
        type: integer
      name:
        type: string
      passes:
        type: integer
      success:
        type: boolean
    type: object
  handler.BenchmarkJobStatus:
    properties:
      elapsed_sec:
        type: integer
      error_message:
        type: string
      estimated_duration_sec:
        type: integer
      job_id:
        type: string
      latest_result:
        $ref: '#/definitions/handler.BenchmarkReport'
      progress_pct:
        type: integer
      scenario:
        type: string
      scenario_label:
        type: string
      started_at:
        type: string
      status:
        description: IDLE, RUNNING, COMPLETED, ABORTED, FAILED
        type: string
    type: object
  handler.BenchmarkReport:
    properties:
      checks:
        items:
          $ref: '#/definitions/handler.BenchmarkCheck'
        type: array
      data_received_kb:
        type: number
      data_sent_kb:
        type: number
      database_analysis:
        $ref: '#/definitions/handler.DatabaseBenchmarkAnalysis'
      duration:
        type: string
      failed_requests:
        type: integer
      job_id:
        type: string
      latency_avg_ms:
        type: number
      latency_max_ms:
        type: number
      latency_med_ms:
        type: number
      latency_min_ms:
        type: number
      latency_p90_ms:
        type: number
      latency_p95_ms:
        type: number
      latency_p99_ms:
        type: number
      rps:
        type: number
      scenario:
        type: string
      scenario_label:
        type: string
      success_rate_pct:
        type: number
      summary:
        $ref: '#/definitions/handler.ExecutiveSummary'
      timestamp:
        type: string
      total_requests:
        type: integer
      vus:
        type: integer
    type: object
  handler.BenchmarkStartRequest:
    properties:
      scenario:
        description: smoke, load, idempotency, stress, spike, soak
        example: smoke
        type: string
    type: object
  handler.BusinessKPIMetrics:
    properties:
      invoices_created_today:
        example: 12
        type: integer
      invoices_paid_today:
        example: 9
        type: integer
      shipments_today:
        example: 34
        type: integer
      topups_today:
        example: 8
        type: integer
    type: object
  handler.DBPoolMetrics:
    properties:
      idle:
        example: 3
        type: integer
      in_use:
        example: 2
        type: integer
      max_open:
        example: 25
        type: integer
      open:
        example: 5
        type: integer
      postgres:
        $ref: '#/definitions/handler.PostgresContainerMetrics'
      wait_count:
        example: 0
        type: integer
      wait_duration_ms:
        example: 0
        type: number
    type: object
  handler.DatabaseBenchmarkAnalysis:
    properties:
      db_recommendation:
        type: string
      db_verdict:
        description: SEHAT, WASPADA, BOTTLENECK
        type: string
      peak_in_use:
        type: integer
      peak_utilization_pct:
        type: number
      pool_max_open:
        type: integer
      slow_queries_count:
        type: integer
      wait_count_delta:
        type: integer
      wait_duration_ms:
        type: number
    type: object
  handler.ExecutiveSummary:
    properties:
      key_findings:
        items:
          type: string
        type: array
      recommendations:
        items:
          type: string
        type: array
      verdict_status:
        description: EXCELLENT, GOOD, WARNING, CRITICAL
        type: string
      verdict_title:
        type: string
    type: object
  handler.GatewayMetrics:
    properties:
      error_rate_pct:
        example: 0.2
        type: number
      idempotency_hits:
        example: 42
        type: integer
      idempotency_misses:
        example: 1520
        type: integer
      p95_latency_ms:
        example: 18.4
        type: number
      rps:
        example: 14.5
        type: number
      total_requests:
        example: 2450
        type: integer
    type: object
  handler.IdempotencyKeyResponse:
    properties:
      expires_in_hours:
        example: 24
        type: integer
      idempotency_key:
        example: a0eebc99-9c0b-4ef8-bb6d-6bb9bd380a11
        type: string
      usage_hint:
        example: Include this key in the 'X-Idempotency-Key' request header for POST/PUT/PATCH/DELETE
          mutations
        type: string
    type: object
  handler.LoginRequest:
    properties:
      identifier:
        description: Email or Phone
        type: string
      password:
        type: string
    type: object
  handler.PostgresContainerMetrics:
    properties:
      cpu_percent:
        example: 6.4
        type: number
      mem_usage_mb:
        example: 36.2
        type: number
      pids:
        example: 11
        type: integer
    type: object
  handler.RegisterRequest:
    properties:
      email:
        type: string
      full_name:
        type: string
      password:
        type: string
      phone:
        type: string
      role:
        type: string
    type: object
  handler.ResetPasswordRequest:
    properties:
      password:
        type: string
    type: object
  handler.RuntimeMetrics:
    properties:
      alloc_mb:
        example: 18.5
        type: number
      go_version:
        example: go1.23
        type: string
      num_gc:
        example: 12
        type: integer
      num_goroutine:
        example: 42
        type: integer
      redis_ping_ms:
        example: 0.4
        type: number
      redis_status:
        example: CONNECTED
        type: string
      sys_mb:
        example: 35.8
        type: number
      uptime_seconds:
        example: 3600
        type: integer
    type: object
  handler.SystemMetricsResponse:
    properties:
      business_kpi:
        $ref: '#/definitions/handler.BusinessKPIMetrics'
      database_pool:
        $ref: '#/definitions/handler.DBPoolMetrics'
      gateway:
        $ref: '#/definitions/handler.GatewayMetrics'
      prometheus_connected:
        type: boolean
      runtime:
        $ref: '#/definitions/handler.RuntimeMetrics'
      slow_queries:
        items:
          $ref: '#/definitions/telemetry.SlowQueryRecord'
        type: array
      timestamp:
        type: string
    type: object
  handler.UpdatePermissionsInput:
    properties:
      permissions:
        items:
          type: string
        type: array
    type: object
  handler.UpdateStatusRequest:
    properties:
      remarks:
        $ref: '#/definitions/domain.PaymentStatus'
    type: object
  response.APIResponse:
    properties:
      data: {}
      errors: {}
      message:
        type: string
      meta:
        $ref: '#/definitions/response.PaginationMeta'
      status:
        type: boolean
    type: object
  response.PaginationMeta:
    properties:
      has_next:
        type: boolean
      has_prev:
        type: boolean
      limit:
        type: integer
      page:
        type: integer
      total_items:
        type: integer
      total_pages:
        type: integer
    type: object
  services.CreateInvoiceInput:
    properties:
      amount:
        type: number
      cashflow_entry_id:
        type: integer
      client_name:
        type: string
      created_by:
        type: string
      invoice_no:
        type: string
      notes:
        type: string
      shipment_date:
        description: YYYY-MM-DD
        type: string
      status:
        description: UNPAID, PAID, OVERDUE (opsional)
        type: string
      top_days:
        type: integer
      top_terms:
        type: string
    type: object
  services.CreateRoleInput:
    properties:
      code:
        type: string
      description:
        type: string
      name:
        type: string
    type: object
  services.CreateUserInput:
    properties:
      email:
        type: string
      full_name:
        type: string
      password:
        type: string
      phone:
        type: string
      role:
        $ref: '#/definitions/domain.UserRole'
      status:
        $ref: '#/definitions/domain.UserStatus'
    type: object
  services.RescheduleDueDateInput:
    properties:
      changed_by:
        type: string
      changed_by_name:
        type: string
      new_due_date:
        description: YYYY-MM-DD
        type: string
      reason:
        type: string
    type: object
  services.SettleInvoiceInput:
    properties:
      created_by:
        type: string
      created_by_name:
        type: string
      notes:
        type: string
      payment_date:
        description: YYYY-MM-DD or RFC3339, default time.Now()
        type: string
      proof_url:
        type: string
      reference_no:
        type: string
    type: object
  services.UpdateRoleInput:
    properties:
      description:
        type: string
      name:
        type: string
    type: object
  services.UpdateUserInput:
    properties:
      email:
        type: string
      full_name:
        type: string
      phone:
        type: string
      role:
        $ref: '#/definitions/domain.UserRole'
      status:
        $ref: '#/definitions/domain.UserStatus'
    type: object
  telemetry.SlowQueryRecord:
    properties:
      duration_ms:
        type: number
      has_error:
        type: boolean
      operation:
        type: string
      query_preview:
        type: string
      repository:
        type: string
      timestamp:
        type: string
    type: object
host: localhost:8080
info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: |-
    High Performance Backend Service for PT. Adijayantara Logistics Indonesia.
    Architecture & Headers:
    - X-API-Version: Target API versioning (e.g. 'v1', 'v2')
    - X-Idempotency-Key: Unique UUID token for safe mutations (POST/PUT/PATCH/DELETE) to prevent duplicates
    - X-Request-ID: Distributed tracing correlation ID
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: Cashflow & Shipment Management API
  version: "1.0"
paths:
  /activity-presets:
    get:
      description: Retrieves master activity descriptions and routes with optional
        category/search filter
      parameters:
      - description: 'API Version (default: v1)'
        in: header
        name: X-API-Version
        type: string
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 100
        description: Items per page
        in: query
        name: limit
        type: integer
      - description: Category filter
        in: query
        name: category
        type: string
      - description: Search keyword
        in: query
        name: search
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.APIResponse'
      security:
      - BearerAuth: []
      summary: List activity presets
      tags:
      - activity-presets
    post:
      consumes:
      - application/json
      description: Creates a new preset for activity description or armada route
      parameters:
      - default: a0eebc99-9c0b-4ef8-bb6d-6bb9bd380a11
        description: Idempotency Key (UUID unik pencegah duplikasi transaksi)
        in: header
        name: X-Idempotency-Key
        type: string
      - description: 'API Version (default: v1)'
        in: header
        name: X-API-Version
        type: string
      - description: New Preset Data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/domain.ActivityPreset'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/response.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.APIResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/response.APIResponse'
      security:
      - BearerAuth: []
      summary: Create new activity preset
      tags:
      - activity-presets
  /activity-presets/{id}:
    delete:
      description: Deletes an activity preset by ID
      parameters:
      - default: a0eebc99-9c0b-4ef8-bb6d-6bb9bd380a11
        description: Idempotency Key (UUID unik pencegah duplikasi transaksi)
        in: header
        name: X-Idempotency-Key
        type: string
      - description: 'API Version (default: v1)'
        in: header
        name: X-API-Version
        type: string
      - description: Preset ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.APIResponse'
      security:
      - BearerAuth: []
      summary: Delete activity preset
      tags:
      - activity-presets
    get:
      description: Retrieves detail of a specific activity preset
      parameters:
      - description: 'API Version (default: v1)'
        in: header
        name: X-API-Version
        type: string
      - description: Preset ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.APIResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.APIResponse'
      security:
      - BearerAuth: []
      summary: Get activity preset by ID
      tags:
      - activity-presets
    put:
      consumes:
      - application/json
      description: Updates an existing activity preset
      parameters:
      - default: a0eebc99-9c0b-4ef8-bb6d-6bb9bd380a11
        description: Idempotency Key (UUID unik pencegah duplikasi transaksi)
        in: header
        name: X-Idempotency-Key
        type: string
      - description: 'API Version (default: v1)'
        in: header
        name: X-API-Version
        type: string
      - description: Preset ID
        in: path
        name: id
        required: true
        type: integer
      - description: Updated Preset Data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/domain.ActivityPreset'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.APIResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/response.APIResponse'
      security:
      - BearerAuth: []
      summary: Update activity preset
      tags:
      - activity-presets
  /analytics/cashflow-runway:
    get:
      description: Menghitung proyeksi saldo kas harian/mingguan berdasarkan invoice
        jatuh tempo vs hutang vendor
      parameters:
      - description: Jumlah hari proyeksi ke depan (default 60)
        in: query
        name: days
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.APIResponse'
      security:
      - BearerAuth: []
      summary: Proyeksi Arus Kas 30-60 Hari (P1) & CCC Gap (P6)
      tags:
      - Analytics
  /analytics/customer-discipline-pareto:
    get:
      description: Menghitung realisasi pembayaran customer vs janji TOP, reschedule
        count, dan kurva Pareto omset
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.APIResponse'
      security:
      - BearerAuth: []
      summary: Skor Kepatuhan DSO Customer (P3) & Analisis Pareto Omset 80/20 (P5)
      tags:
      - Analytics
  /analytics/route-matrix:
    get:
      description: 'Memetakan performa rute ke dalam 4 kuadran: Bintang, Potensial,
        Sapi Perah, dan Evaluasi'
      parameters:
      - description: Filter tanggal mulai (YYYY-MM-DD)
        in: query
        name: date_from
        type: string
      - description: Filter tanggal selesai (YYYY-MM-DD)
        in: query
        name: date_to
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.APIResponse'
      security:
      - BearerAuth: []
      summary: Matriks Kuadran Profitabilitas Rute BCG (P2)
      tags:
      - Analytics
  /analytics/vendor-efficiency:
    get:
      description: Menghitung rasio konsentrasi armada vendor, total biaya pokok,
        dan rata-rata margin keuntungan
      parameters:
      - description: Filter tanggal mulai (YYYY-MM-DD)
        in: query
        name: date_from
        type: string
      - description: Filter tanggal selesai (YYYY-MM-DD)
        in: query
        name: date_to
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.APIResponse'
      security:
      - BearerAuth: []
      summary: Analisis Efisiensi & Ketergantungan Rekanan Vendor (P4)
      tags:
      - Analytics
  /audit/anomalies:
    get:
      description: Daftar anomali selisih margin negatif, biaya janggal, dan transaksi
        terindikasi fraud
      parameters:
      - description: Nomor halaman (default 1)
        in: query
        name: page
        type: integer
      - description: Jumlah data per halaman (default 50)
        in: query
        name: limit
        type: integer
      - description: Filter severity (LOW, MEDIUM, HIGH, CRITICAL)
        in: query
        name: severity
        type: string
      - description: Filter tanggal mulai (YYYY-MM-DD)
        in: query
        name: start_date
        type: string
      - description: Filter tanggal akhir (YYYY-MM-DD)
        in: query
        name: end_date
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.APIResponse'
      security:
      - BearerAuth: []
      summary: Get Fraud & Margin Anomalies
      tags:
      - Audit
  /audit/input-lag:
    get:
      description: Daftar transaksi yang diinput terlambat melewati batas SLA toleransi
        (input lag backlog)
      parameters:
      - description: Nomor halaman (default 1)
        in: query
        name: page
        type: integer
      - description: Jumlah data per halaman (default 50)
        in: query
        name: limit
        type: integer
      - description: Minimal hari keterlambatan input
        in: query
        name: min_lag_days
        type: integer
      - description: Filter tanggal mulai (YYYY-MM-DD)
        in: query
        name: start_date
        type: string
      - description: Filter tanggal akhir (YYYY-MM-DD)
        in: query
        name: end_date
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.APIResponse'
      security:
      - BearerAuth: []
      summary: Get Input Lag and Delay Records
      tags:
      - Audit
  /audit/logs:
    get:
      description: Daftar rekaman log audit forensik lengkap (append-only ledger)
        dengan filter multivariat
      parameters:
      - description: Nomor halaman (default 1)
        in: query
        name: page
        type: integer
      - description: Jumlah data per halaman (default 50)
        in: query
        name: limit
        type: integer
      - description: Pencarian nama staf pembuat perubahan
        in: query
        name: actor_name
        type: string
      - description: Aksi audit (CREATE, UPDATE, DELETE, SETTLE, RESCHEDULE)
        in: query
        name: action
        type: string
      - description: Entitas terdampak (cashflow, invoice, vendor, customer, user)
        in: query
        name: entity_type
        type: string
      - description: Tingkat keparahan (INFO, LOW, MEDIUM, HIGH, CRITICAL)
        in: query
        name: severity
        type: string
      - description: Kata kunci pencarian deskripsi / diff
        in: query
