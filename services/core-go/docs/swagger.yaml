basePath: /api/v1
definitions:
  domain.ActivityPreset:
    properties:
      category:
        description: '''ACT_INFO'' or ''ACT_EXPLAIN'''
        type: string
      created_at:
        type: string
      deleted_at:
        type: string
      description:
        type: string
      id:
        type: integer
      is_active:
        type: boolean
      name:
        type: string
      updated_at:
        type: string
    type: object
  domain.CashflowEntry:
    properties:
      act_explaination:
        type: string
      act_information:
        type: string
      created_at:
        type: string
      created_by:
        type: string
      date_of_entry:
        type: string
      debit:
        type: number
      due_date:
        type: string
      entry_type:
        $ref: '#/definitions/domain.EntryType'
      grand_cost:
        type: number
      grand_selling:
        type: number
      id:
        type: integer
      kredit:
        type: number
      margin_pct:
        type: number
      profit:
        type: number
      remarks:
        $ref: '#/definitions/domain.PaymentStatus'
      saldo:
        type: number
      sequence_no:
        type: integer
      top_days:
        type: integer
      updated_at:
        type: string
      updated_by:
        type: string
      vendor_id:
        type: integer
      vendor_name_raw:
        type: string
    type: object
  domain.Customer:
    properties:
      address:
        type: string
      created_at:
        type: string
      deleted_at:
        type: string
      email:
        type: string
      id:
        type: integer
      name:
        type: string
      notes:
        type: string
      phone:
        type: string
      pic_name:
        type: string
      updated_at:
        type: string
    type: object
  domain.EntryType:
    enum:
    - SHIPMENT
    - TOP_UP
    type: string
    x-enum-varnames:
    - EntryShipment
    - EntryTopUp
  domain.PaymentStatus:
    enum:
    - PAID
    - UNPAID
    - PENDING
    type: string
    x-enum-varnames:
    - PaymentPaid
    - PaymentUnpaid
    - PaymentPending
  domain.UserRole:
    enum:
    - super_admin
    - admin
    - finance
    - direktur
    - owner
    - operator
    - viewer
    type: string
    x-enum-comments:
      RoleAdmin: Administrator Bisnis / Head of Operations
      RoleDirektur: Direktur / Manajemen (Monitoring & Review)
      RoleFinance: Staf Keuangan & Akuntansi (Input Transaksi & Invoice)
      RoleOwner: Pemilik Modal / Investor (Executive Dashboard)
      RoleSuperAdmin: IT Master / Developer (Tersembunyi, Fail-safe All Access)
    x-enum-descriptions:
    - IT Master / Developer (Tersembunyi, Fail-safe All Access)
    - Administrator Bisnis / Head of Operations
    - Staf Keuangan & Akuntansi (Input Transaksi & Invoice)
    - Direktur / Manajemen (Monitoring & Review)
    - Pemilik Modal / Investor (Executive Dashboard)
    - ""
    - ""
    x-enum-varnames:
    - RoleSuperAdmin
    - RoleAdmin
    - RoleFinance
    - RoleDirektur
    - RoleOwner
    - RoleOperator
    - RoleViewer
  domain.UserStatus:
    enum:
    - ACTIVE
    - INACTIVE
    - SUSPENDED
    type: string
    x-enum-varnames:
    - StatusActive
    - StatusInactive
    - StatusSuspended
  domain.Vendor:
    properties:
      created_at:
        type: string
      deleted_at:
        type: string
      email:
        type: string
      id:
        type: integer
      name:
        type: string
      notes:
        type: string
      phone:
        type: string
      updated_at:
        type: string
    type: object
  handler.IdempotencyKeyResponse:
    properties:
      expires_in_hours:
        example: 24
        type: integer
      idempotency_key:
        example: a0eebc99-9c0b-4ef8-bb6d-6bb9bd380a11
        type: string
      usage_hint:
        example: Include this key in the 'X-Idempotency-Key' request header for POST/PUT/PATCH/DELETE
          mutations
        type: string
    type: object
  handler.LoginRequest:
    properties:
      identifier:
        description: Email or Phone
        type: string
      password:
        type: string
    type: object
  handler.RegisterRequest:
    properties:
      email:
        type: string
      full_name:
        type: string
      password:
        type: string
      phone:
        type: string
      role:
        type: string
    type: object
  handler.ResetPasswordRequest:
    properties:
      password:
        type: string
    type: object
  handler.UpdatePermissionsInput:
    properties:
      permissions:
        items:
          type: string
        type: array
    type: object
  handler.UpdateStatusRequest:
    properties:
      remarks:
        $ref: '#/definitions/domain.PaymentStatus'
    type: object
  response.APIResponse:
    properties:
      data: {}
      errors: {}
      message:
        type: string
      meta:
        $ref: '#/definitions/response.PaginationMeta'
      status:
        type: boolean
    type: object
  response.PaginationMeta:
    properties:
      has_next:
        type: boolean
      has_prev:
        type: boolean
      limit:
        type: integer
      page:
        type: integer
      total_items:
        type: integer
      total_pages:
        type: integer
    type: object
  services.CreateRoleInput:
    properties:
      code:
        type: string
      description:
        type: string
      name:
        type: string
    type: object
  services.CreateUserInput:
    properties:
      email:
        type: string
      full_name:
        type: string
      password:
        type: string
      phone:
        type: string
      role:
        $ref: '#/definitions/domain.UserRole'
      status:
        $ref: '#/definitions/domain.UserStatus'
    type: object
  services.UpdateRoleInput:
    properties:
      description:
        type: string
      name:
        type: string
    type: object
  services.UpdateUserInput:
    properties:
      email:
        type: string
      full_name:
        type: string
      phone:
        type: string
      role:
        $ref: '#/definitions/domain.UserRole'
      status:
        $ref: '#/definitions/domain.UserStatus'
    type: object
host: localhost:8080
info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: |-
    High Performance Backend Service for PT. Adijayantara Logistics Indonesia.
    Architecture & Headers:
    - X-API-Version: Target API versioning (e.g. 'v1', 'v2')
    - X-Idempotency-Key: Unique UUID token for safe mutations (POST/PUT/PATCH/DELETE) to prevent duplicates
    - X-Request-ID: Distributed tracing correlation ID
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: Cashflow & Shipment Management API
  version: "1.0"
paths:
  /activity-presets:
    get:
      description: Retrieves master activity descriptions and routes with optional
        category/search filter
      parameters:
      - description: 'API Version (default: v1)'
        in: header
        name: X-API-Version
        type: string
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 100
        description: Items per page
        in: query
        name: limit
        type: integer
      - description: Category filter
        in: query
        name: category
        type: string
      - description: Search keyword
        in: query
        name: search
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.APIResponse'
      security:
      - BearerAuth: []
      summary: List activity presets
      tags:
      - activity-presets
    post:
      consumes:
      - application/json
      description: Creates a new preset for activity description or armada route
      parameters:
      - default: a0eebc99-9c0b-4ef8-bb6d-6bb9bd380a11
        description: Idempotency Key (UUID unik pencegah duplikasi transaksi)
        in: header
        name: X-Idempotency-Key
        type: string
      - description: 'API Version (default: v1)'
        in: header
        name: X-API-Version
        type: string
      - description: New Preset Data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/domain.ActivityPreset'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/response.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.APIResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/response.APIResponse'
      security:
      - BearerAuth: []
      summary: Create new activity preset
      tags:
      - activity-presets
  /activity-presets/{id}:
    delete:
      description: Deletes an activity preset by ID
      parameters:
      - default: a0eebc99-9c0b-4ef8-bb6d-6bb9bd380a11
        description: Idempotency Key (UUID unik pencegah duplikasi transaksi)
        in: header
        name: X-Idempotency-Key
        type: string
      - description: 'API Version (default: v1)'
        in: header
        name: X-API-Version
        type: string
      - description: Preset ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.APIResponse'
      security:
      - BearerAuth: []
      summary: Delete activity preset
      tags:
      - activity-presets
    get:
      description: Retrieves detail of a specific activity preset
      parameters:
      - description: 'API Version (default: v1)'
        in: header
        name: X-API-Version
        type: string
      - description: Preset ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.APIResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.APIResponse'
      security:
      - BearerAuth: []
      summary: Get activity preset by ID
      tags:
      - activity-presets
    put:
      consumes:
      - application/json
      description: Updates an existing activity preset
      parameters:
      - default: a0eebc99-9c0b-4ef8-bb6d-6bb9bd380a11
        description: Idempotency Key (UUID unik pencegah duplikasi transaksi)
        in: header
        name: X-Idempotency-Key
        type: string
      - description: 'API Version (default: v1)'
        in: header
        name: X-API-Version
        type: string
      - description: Preset ID
        in: path
        name: id
        required: true
        type: integer
      - description: Updated Preset Data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/domain.ActivityPreset'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.APIResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/response.APIResponse'
      security:
      - BearerAuth: []
      summary: Update activity preset
      tags:
      - activity-presets
  /auth/login:
    post:
      consumes:
      - application/json
      description: Login using email or phone number and password
      parameters:
      - description: 'API Version (default: v1)'
        in: header
        name: X-API-Version
        type: string
      - description: Login Credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.APIResponse'
      summary: User login
      tags:
      - auth
  /auth/logout:
    post:
      description: Revokes session token and clears HttpOnly session cookie
      parameters:
      - description: 'API Version (default: v1)'
        in: header
        name: X-API-Version
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.APIResponse'
      summary: User logout
      tags:
      - auth
  /auth/me:
    get:
      description: Returns the active session profile including role and assigned
        permissions
      parameters:
      - description: 'API Version (default: v1)'
        in: header
        name: X-API-Version
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.APIResponse'
      security:
      - BearerAuth: []
      summary: Get current user profile
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Registers a new staff user pending administrator verification
      parameters:
      - default: a0eebc99-9c0b-4ef8-bb6d-6bb9bd380a11
        description: Idempotency Key (UUID unik pencegah duplikasi transaksi)
        in: header
        name: X-Idempotency-Key
        type: string
      - description: 'API Version (default: v1)'
        in: header
        name: X-API-Version
        type: string
      - description: Registration Data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/response.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.APIResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/response.APIResponse'
      summary: Register new user
      tags:
      - auth
  /cashflow:
    get:
      parameters:
      - description: 'API Version (default: v1)'
        in: header
        name: X-API-Version
        type: string
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 50
        description: Items per page
        in: query
        name: limit
        type: integer
      - default: ASC
        description: Sort direction (ASC/DESC)
        in: query
        name: sort
        type: string
      - description: Start date (YYYY-MM-DD)
        in: query
        name: date_from
        type: string
      - description: End date (YYYY-MM-DD)
        in: query
        name: date_to
        type: string
      - description: Entry type (SHIPMENT/TOP_UP)
        in: query
        name: entry_type
        type: string
      - description: Payment status (PAID/UNPAID/PENDING)
        in: query
        name: remarks
        type: string
      - description: Vendor search keyword
        in: query
        name: vendor_name
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.APIResponse'
      security:
      - BearerAuth: []
      summary: Get dashboard cashflow entries
      tags:
      - cashflow
  /cashflow/{id}:
    delete:
      parameters:
      - default: a0eebc99-9c0b-4ef8-bb6d-6bb9bd380a11
        description: Idempotency Key (UUID unik pencegah duplikasi transaksi)
        in: header
        name: X-Idempotency-Key
        type: string
      - description: 'API Version (default: v1)'
        in: header
        name: X-API-Version
        type: string
      - description: Entry ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.APIResponse'
      security:
      - BearerAuth: []
      summary: Delete a cashflow entry
      tags:
      - cashflow
    put:
      consumes:
      - application/json
      parameters:
      - default: a0eebc99-9c0b-4ef8-bb6d-6bb9bd380a11
        description: Idempotency Key (UUID unik pencegah duplikasi transaksi)
        in: header
        name: X-Idempotency-Key
        type: string
      - description: 'API Version (default: v1)'
        in: header
        name: X-API-Version
        type: string
      - description: Entry ID
        in: path
        name: id
        required: true
        type: integer
      - description: Updated Entry Data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/domain.CashflowEntry'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.APIResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/response.APIResponse'
      security:
      - BearerAuth: []
      summary: Update a cashflow entry
      tags:
      - cashflow
  /cashflow/{id}/status:
    patch:
      consumes:
      - application/json
      parameters:
      - default: a0eebc99-9c0b-4ef8-bb6d-6bb9bd380a11
        description: Idempotency Key (UUID unik pencegah duplikasi transaksi)
        in: header
        name: X-Idempotency-Key
        type: string
      - description: 'API Version (default: v1)'
        in: header
        name: X-API-Version
        type: string
      - description: Entry ID
        in: path
        name: id
        required: true
        type: integer
      - description: Payment Status Data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.UpdateStatusRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.APIResponse'
      security:
      - BearerAuth: []
      summary: Update payment status (Remarks)
      tags:
      - cashflow
  /cashflow/export:
    get:
      produces:
      - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
      responses:
        "200":
          description: OK
      security:
      - BearerAuth: []
      summary: Export cashflow data to Excel
      tags:
      - cashflow
  /cashflow/import:
    post:
      consumes:
      - multipart/form-data
      parameters:
      - description: Excel File
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.APIResponse'
      security:
      - BearerAuth: []
      summary: Import cashflow data from Excel
      tags:
      - cashflow
  /cashflow/shipment:
    post:
      consumes:
      - application/json
      parameters:
      - default: a0eebc99-9c0b-4ef8-bb6d-6bb9bd380a11
        description: Idempotency Key (UUID unik pencegah duplikasi transaksi)
        in: header
        name: X-Idempotency-Key
        type: string
      - description: 'API Version (default: v1)'
        in: header
        name: X-API-Version
        type: string
      - description: Shipment Entry Data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/domain.CashflowEntry'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/response.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.APIResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/response.APIResponse'
      security:
      - BearerAuth: []
      summary: Record a Shipment entry
      tags:
      - cashflow
  /cashflow/summary:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.APIResponse'
      security:
      - BearerAuth: []
      summary: Get dashboard cashflow summary
      tags:
      - cashflow
  /cashflow/topup:
    post:
      consumes:
      - application/json
      parameters:
      - default: a0eebc99-9c0b-4ef8-bb6d-6bb9bd380a11
        description: Idempotency Key (UUID unik pencegah duplikasi transaksi)
        in: header
        name: X-Idempotency-Key
        type: string
      - description: 'API Version (default: v1)'
        in: header
        name: X-API-Version
        type: string
      - description: Top-Up Entry Data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/domain.CashflowEntry'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/response.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.APIResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/response.APIResponse'
      security:
      - BearerAuth: []
      summary: Record a Top-Up entry
      tags:
      - cashflow
  /customers:
    get:
      parameters:
      - description: 'API Version (default: v1)'
        in: header
        name: X-API-Version
        type: string
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 50
        description: Items per page
        in: query
        name: limit
        type: integer
      - description: Search query
        in: query
        name: search
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.APIResponse'
      security:
      - BearerAuth: []
      summary: Get all customers
      tags:
      - customers
    post:
      consumes:
      - application/json
      parameters:
      - default: a0eebc99-9c0b-4ef8-bb6d-6bb9bd380a11
        description: Idempotency Key (UUID unik pencegah duplikasi transaksi)
        in: header
        name: X-Idempotency-Key
        type: string
      - description: 'API Version (default: v1)'
        in: header
        name: X-API-Version
        type: string
      - description: Customer Data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/domain.Customer'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/response.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.APIResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/response.APIResponse'
      security:
      - BearerAuth: []
      summary: Create new customer
      tags:
      - customers
  /customers/{id}:
    delete:
      parameters:
      - default: a0eebc99-9c0b-4ef8-bb6d-6bb9bd380a11
        description: Idempotency Key (UUID unik pencegah duplikasi transaksi)
        in: header
        name: X-Idempotency-Key
        type: string
      - description: 'API Version (default: v1)'
        in: header
